# Servidor de MLflow: metadata en postgres-mlflow, artefactos en MinIO.
# Con --serve-artifacts el servidor hace de proxy hacia MinIO: Airflow y la API solo
# necesitan MLFLOW_TRACKING_URI, no credenciales de S3 (mismo diseno que taller004).
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: mlops-p2-mlflow          # kustomization.yaml lo reemplaza por docker.io/<usuario>/...:<tag>
          command: ["mlflow", "server"]
          # Kubernetes expande $(VAR) con las variables de entorno del contenedor.
          # +psycopg2 explicito: SQLAlchemy 2.x usa psycopg (v3) por defecto con postgresql://.
          args:
            - --backend-store-uri=postgresql+psycopg2://$(MLFLOW_DB_USER):$(MLFLOW_DB_PASSWORD)@postgres-mlflow:5432/$(MLFLOW_DB_NAME)
            - --artifacts-destination=s3://$(MLFLOW_BUCKET)
            - --serve-artifacts
            - --host=0.0.0.0
            - --port=5000
            # 1 worker basta: solo lo llaman Airflow (al registrar) y la API (al cambiar el modelo).
            - --workers=1
            - --allowed-hosts=$(MLFLOW_ALLOWED_HOSTS)
          ports:
            - name: http
              containerPort: 5000
          env:
            # MLflow 3 arranca por defecto un "job runner" con ~7 procesos (huey) para sus
            # funciones de GenAI (jueces LLM, optimizacion de prompts, tareas periodicas).
            # Medido con 3.16.1: ~2,2 GB con jobs vs ~470 MB sin jobs (1 worker). Este
            # proyecto no usa esas funciones; con ellas el pod moria por OOMKilled (limite 1Gi).
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            - name: MLFLOW_DB_USER
              valueFrom: { secretKeyRef: { name: postgres-mlflow-credentials, key: MLFLOW_DB_USER } }
            - name: MLFLOW_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-mlflow-credentials, key: MLFLOW_DB_PASSWORD } }
            - name: MLFLOW_DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-mlflow-credentials, key: MLFLOW_DB_NAME } }
            - name: MLFLOW_BUCKET
              valueFrom: { configMapKeyRef: { name: mlops-config, key: MLFLOW_BUCKET } }
            - name: MLFLOW_ALLOWED_HOSTS
              valueFrom: { configMapKeyRef: { name: mlops-config, key: MLFLOW_ALLOWED_HOSTS } }
            # boto3 (dentro del servidor) usa esto para hablar con MinIO
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom: { configMapKeyRef: { name: mlops-config, key: MINIO_ENDPOINT } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          # /health no pasa por la validacion de --allowed-hosts (verificado con mlflow 3.16.1),
          # asi que el kubelet puede consultarlo con la IP del pod como Host.
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
